name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Generated code matches its sources
        run: tool/check_codegen_drift.sh

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test patrol_test pigeons

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit, widget and architecture tests
        run: flutter test --exclude-tags golden --coverage

      - name: Coverage floors
        run: dart run tool/check_coverage.dart

      - name: Golden tests
        run: flutter test --tags golden

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: test/**/failures/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get

      - name: Build
        run: flutter build apk --debug --dart-define-from-file=env/dev.json

      - name: Kotlin unit tests, ktlint, Android Lint
        working-directory: android
        run: >-
          ./gradlew --console=plain
          :app:testDebugUnitTest
          :app:ktlintCheck :app:lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: build/app/reports/
