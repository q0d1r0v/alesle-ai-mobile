name: Release

# A tag v<versionName> (pubspec `version: x.y.z+code`) builds the signed APK,
# attaches it to a GitHub release, optionally copies it to the CDN, and
# publishes the manifest to the API (SOW 02 §3). Secrets and variables are
# listed in README "Releasing".
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get

      - name: The tag names the pubspec version
        run: |
          name="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml)"
          test "v${name}" = "${GITHUB_REF_NAME}" || {
            echo "::error::tag ${GITHUB_REF_NAME} but pubspec says ${name}"; exit 1; }
          echo "VERSION_NAME=${name}" >> "$GITHUB_ENV"

      - name: Release key (from secrets, never printed)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!v}" || { echo "::error::secret for $v is not set"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build the release APK
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          # Obfuscated Dart; the symbols to read crash stacks stay with the release.
          flutter build apk --release --dart-define-from-file=env/prod.json \
            --dart-define=SENTRY_DSN="${SENTRY_DSN}" \
            --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk "alesle-${VERSION_NAME}.apk"
          tar -czf "alesle-${VERSION_NAME}-symbols.tar.gz" -C build symbols

      - name: Where the APK is served
        env:
          CDN_BASE_URL: ${{ vars.RELEASE_CDN_BASE_URL }}
        run: |
          if [ -n "$CDN_BASE_URL" ]; then
            url="${CDN_BASE_URL%/}/alesle-${VERSION_NAME}.apk"
          else
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/alesle-${VERSION_NAME}.apk"
          fi
          echo "APK_URL=${url}" >> "$GITHUB_ENV"

      - name: Manifest (SHA-256 of the file and of the signing certificate)
        run: |
          tool/apk_manifest.sh "alesle-${VERSION_NAME}.apk" "$APK_URL" > release.json
          jq -r '.sha256' release.json > "alesle-${VERSION_NAME}.apk.sha256"
          cat release.json

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alesle-${{ env.VERSION_NAME }}.apk
            alesle-${{ env.VERSION_NAME }}.apk.sha256
            release.json

      - name: Copy to the CDN
        if: vars.RELEASE_CDN_BASE_URL != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.RELEASE_S3_REGION }}
          BUCKET: ${{ vars.RELEASE_S3_BUCKET }}
          ENDPOINT: ${{ vars.RELEASE_S3_ENDPOINT }}
        run: |
          aws s3 cp "alesle-${VERSION_NAME}.apk" "s3://${BUCKET}/alesle-${VERSION_NAME}.apk" \
            ${ENDPOINT:+--endpoint-url "$ENDPOINT"} \
            --content-type application/vnd.android.package-archive \
            --cache-control "public, max-age=31536000, immutable"
          curl -fsSI "$APK_URL" > /dev/null

      - name: Publish the manifest
        if: vars.RELEASE_API_URL != ''
        env:
          API_URL: ${{ vars.RELEASE_API_URL }}
          TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          curl -fsS -X POST "${API_URL%/}/v1/app/releases" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data @release.json

      - name: Keep the debug symbols (private)
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ env.VERSION_NAME }}
          path: alesle-${{ env.VERSION_NAME }}-symbols.tar.gz
          retention-days: 400

      - name: Forget the key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"
