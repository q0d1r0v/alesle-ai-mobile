include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # freezed/json_serializable place annotations on generated members.
    invalid_annotation_target: ignore
    # Treat these as errors so `flutter analyze --fatal-infos` is not the only guard.
    unawaited_futures: error
    avoid_print: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/api/generated/**"
    - "lib/core/platform/generated/**"
    - "lib/app/l10n/app_localizations*.dart"
    - build/**
    - android/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_build_context_synchronously
    - use_super_parameters
