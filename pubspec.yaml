name: alesle_ai
description: "Alesle AI — personal AI agent for Android"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  app_links: ^6.4.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  freezed: ^4.0.2
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  patrol: ^4.10.0
  pigeon: ^29.0.10
  retrofit_generator: ^10.2.12
  swagger_parser: ^1.45.0

flutter:
  uses-material-design: true
  generate: true
  # Geist (SIL OFL 1.1, assets/fonts/OFL.txt): the design system's typeface.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700

patrol:
  app_name: Alesle AI
  test_directory: patrol_test
  android:
    package_name: com.alesle.ai
